<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A001F"/>
      <stop offset="50%" stop-color="#2E0013"/>
      <stop offset="100%" stop-color="#1A000A"/>
    </linearGradient>
    <linearGradient id="goldL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="50%" stop-color="#D4AF7F"/>
      <stop offset="100%" stop-color="#AA7738"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgG)"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="url(#goldL)" stroke-width="1.5" opacity="0.4"/>
  <rect x="42" y="42" width="716" height="516" fill="none" stroke="url(#goldL)" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.25"/>
  
  <!-- Rings Icon in Center -->
  <g transform="translate(400, 270)">
    <!-- Ring 1 -->
    <ellipse cx="-25" cy="0" rx="45" ry="50" fill="none" stroke="url(#goldL)" stroke-width="5" transform="rotate(-15)"/>
    <!-- Diamond atop ring 1 -->
    <polygon points="-58,-48 -50,-56 -42,-48 -50,-38" fill="url(#goldL)"/>
    <!-- Ring 2 -->
    <ellipse cx="25" cy="5" rx="45" ry="50" fill="none" stroke="url(#goldL)" stroke-width="5" transform="rotate(15)"/>
  </g>
  
  <text x="400" y="380" font-family="'Great Vibes', cursive" font-size="44" fill="url(#goldL)" text-anchor="middle">Isabella &amp; Alexander</text>
  <text x="400" y="420" font-family="'Montserrat', sans-serif" font-size="14" fill="#F5EBDD" text-anchor="middle" letter-spacing="4" opacity="0.85">PRENUPTIAL PORTRAIT</text>
</svg>
