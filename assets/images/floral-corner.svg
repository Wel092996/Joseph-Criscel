<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A51D3D" />
      <stop offset="40%" stop-color="#800020" />
      <stop offset="100%" stop-color="#4A001F" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D94E68" />
      <stop offset="100%" stop-color="#6D102C" />
    </linearGradient>
    <linearGradient id="goldVine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EBDD" />
      <stop offset="40%" stop-color="#D4AF7F" />
      <stop offset="100%" stop-color="#9C6B30" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#556B2F" />
      <stop offset="50%" stop-color="#3B4D20" />
      <stop offset="100%" stop-color="#283515" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Corner Ornamental Vines (Gold) -->
  <g fill="none" stroke="url(#goldVine)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top horizontal border line -->
    <path d="M 12 12 L 180 12 C 195 12, 210 20, 215 35 C 220 50, 210 65, 195 62 C 180 60, 182 45, 195 45 C 205 45, 205 55, 198 56" />
    <!-- Left vertical border line -->
    <path d="M 12 12 L 12 180 C 12 195, 20 210, 35 215 C 50 220, 65 210, 62 195 C 60 180, 45 182, 45 195 C 45 205, 55 205, 56 198" />
    <!-- Secondary corner inner flourish -->
    <path d="M 28 28 L 130 28 C 145 28, 155 35, 150 48 C 145 60, 130 55, 135 45 C 138 38, 148 40, 146 48" stroke-width="1.2" />
    <path d="M 28 28 L 28 130 C 28 145, 35 155, 48 150 C 60 145, 55 130, 45 135 C 38 138, 40 148, 48 146" stroke-width="1.2" />
    
    <!-- Small tendrils -->
    <path d="M 60 12 C 75 5, 95 18, 90 28" stroke-width="1.2" />
    <path d="M 12 60 C 5 75, 18 95, 28 90" stroke-width="1.2" />
  </g>

  <!-- Deep Green / Olive Accented Leaves -->
  <g fill="url(#leafGrad)" stroke="url(#goldVine)" stroke-width="0.8">
    <!-- Leaf clusters -->
    <path d="M 65 42 C 80 32, 95 40, 88 52 C 78 50, 70 48, 65 42 Z" />
    <path d="M 42 65 C 32 80, 40 95, 52 88 C 50 78, 48 70, 42 65 Z" />
    <path d="M 105 32 C 120 25, 128 35, 120 44 C 112 42, 108 38, 105 32 Z" />
    <path d="M 32 105 C 25 120, 35 128, 44 120 C 42 112, 38 108, 32 105 Z" />
  </g>

  <!-- Golden Bud Berries -->
  <g fill="url(#goldVine)">
    <circle cx="100" cy="22" r="3" />
    <circle cx="112" cy="18" r="2.5" />
    <circle cx="22" cy="100" r="3" />
    <circle cx="18" cy="112" r="2.5" />
    <circle cx="130" cy="38" r="2.5" />
    <circle cx="38" cy="130" r="2.5" />
  </g>

  <!-- Main Burgundy Rose Centerpiece in Corner -->
  <g transform="translate(48, 48)" filter="url(#glow)">
    <!-- Base Outer Petals -->
    <path d="M 0 -24 C 15 -28, 28 -15, 24 0 C 28 15, 15 28, 0 24 C -15 28, -28 15, -24 0 C -28 -15, -15 -28, 0 -24 Z" fill="url(#roseGrad)" stroke="#4A001F" stroke-width="0.8" />
    <!-- Layer 2 Petals -->
    <path d="M -8 -18 C 10 -22, 22 -6, 16 10 C 8 20, -10 18, -16 6 C -20 -4, -18 -14, -8 -18 Z" fill="url(#roseAccent)" opacity="0.95" />
    <!-- Layer 3 Petals -->
    <path d="M 4 -12 C 15 -10, 16 4, 8 12 C 0 16, -12 10, -10 0 C -8 -8, -2 -14, 4 -12 Z" fill="url(#roseGrad)" />
    <!-- Rose Core Spiral -->
    <path d="M -2 -5 C 6 -8, 8 2, 2 6 C -4 8, -6 0, -1 -3 C 2 -4, 4 -1, 1 1" fill="none" stroke="url(#goldVine)" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Smaller Secondary Burgundy Rose -->
  <g transform="translate(108, 42) scale(0.65)" filter="url(#glow)">
    <path d="M 0 -20 C 12 -24, 24 -12, 20 0 C 24 12, 12 24, 0 20 C -12 24, -24 12, -20 0 C -24 -12, -12 -24, 0 -20 Z" fill="url(#roseGrad)" />
    <path d="M -6 -14 C 8 -18, 16 -4, 12 8 C 6 16, -8 14, -12 4 C -15 -4, -14 -11, -6 -14 Z" fill="url(#roseAccent)" />
    <circle cx="0" cy="0" r="4" fill="url(#goldVine)" />
  </g>

  <g transform="translate(42, 108) scale(0.65)" filter="url(#glow)">
    <path d="M 0 -20 C 12 -24, 24 -12, 20 0 C 24 12, 12 24, 0 20 C -12 24, -24 12, -20 0 C -24 -12, -12 -24, 0 -20 Z" fill="url(#roseGrad)" />
    <path d="M -6 -14 C 8 -18, 16 -4, 12 8 C 6 16, -8 14, -12 4 C -15 -4, -14 -11, -6 -14 Z" fill="url(#roseAccent)" />
    <circle cx="0" cy="0" r="4" fill="url(#goldVine)" />
  </g>
</svg>
