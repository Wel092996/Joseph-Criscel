<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="bankGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF7F"/>
      <stop offset="100%" stop-color="#9C6B30"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="20" fill="#FFFFFF" stroke="url(#bankGold)" stroke-width="4"/>
  
  <!-- Header Banner -->
  <rect x="0" y="0" width="320" height="60" rx="18" fill="#4A001F"/>
  <rect x="0" y="45" width="320" height="15" fill="#4A001F"/>
  <text x="160" y="38" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" fill="#FFF8F0" text-anchor="middle" letter-spacing="3">BANK TRANSFER QR</text>
  
  <!-- Simulated QR Pattern Matrix -->
  <g fill="#4A001F" transform="translate(40, 80)">
    <!-- Targets -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#6D102C"/>
    <rect x="10" y="10" width="40" height="40" rx="4" fill="#FFFFFF"/>
    <rect x="18" y="18" width="24" height="24" rx="2" fill="#6D102C"/>

    <rect x="180" y="0" width="60" height="60" rx="8" fill="#6D102C"/>
    <rect x="190" y="10" width="40" height="40" rx="4" fill="#FFFFFF"/>
    <rect x="198" y="18" width="24" height="24" rx="2" fill="#6D102C"/>

    <rect x="0" y="140" width="60" height="60" rx="8" fill="#6D102C"/>
    <rect x="10" y="150" width="40" height="40" rx="4" fill="#FFFFFF"/>
    <rect x="18" y="158" width="24" height="24" rx="2" fill="#6D102C"/>

    <!-- Data Blocks -->
    <rect x="70" y="10" width="25" height="15"/>
    <rect x="110" y="15" width="20" height="20"/>
    <rect x="145" y="5" width="25" height="25"/>
    <rect x="80" y="35" width="15" height="25"/>
    <rect x="125" y="40" width="35" height="15"/>
    
    <rect x="10" y="70" width="15" height="25"/>
    <rect x="35" y="80" width="25" height="15"/>
    <rect x="75" y="70" width="35" height="15"/>
    <rect x="130" y="75" width="15" height="20"/>
    <rect x="160" y="65" width="20" height="25"/>
    <rect x="195" y="80" width="35" height="15"/>

    <!-- Center Logo Shield -->
    <circle cx="120" cy="100" r="22" fill="#FFFFFF" stroke="#D4AF7F" stroke-width="2.5"/>
    <text x="120" y="106" font-family="'Great Vibes', cursive" font-size="20" font-weight="bold" fill="#6D102C" text-anchor="middle">BPI</text>

    <rect x="15" y="110" width="35" height="15"/>
    <rect x="65" y="105" width="20" height="20"/>
    <rect x="155" y="105" width="25" height="25"/>
    <rect x="190" y="115" width="15" height="15"/>
    <rect x="215" y="105" width="20" height="25"/>

    <rect x="70" y="140" width="15" height="30"/>
    <rect x="95" y="155" width="35" height="15"/>
    <rect x="145" y="140" width="25" height="25"/>
    <rect x="185" y="145" width="20" height="25"/>
    <rect x="215" y="150" width="25" height="20"/>

    <rect x="75" y="180" width="45" height="15"/>
    <rect x="135" y="175" width="30" height="20"/>
    <rect x="180" y="180" width="45" height="15"/>
  </g>

  <!-- Footer Tag -->
  <text x="160" y="300" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#4A001F" text-anchor="middle" letter-spacing="1.5">BPI / BDO ACCOUNT</text>
</svg>
