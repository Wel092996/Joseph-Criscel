<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4A001F" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#300014" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#19000A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="30%" stop-color="#D4AF7F"/>
      <stop offset="70%" stop-color="#AA7738"/>
      <stop offset="100%" stop-color="#FFF8F0"/>
    </linearGradient>
    <pattern id="damask" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 60 10 C 50 30, 20 40, 20 60 C 20 80, 50 90, 60 110 C 70 90, 100 80, 100 60 C 100 40, 70 30, 60 10 Z" fill="none" stroke="#6D102C" stroke-width="0.8" opacity="0.3"/>
      <circle cx="60" cy="60" r="4" fill="#D4AF7F" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Deep Wine Background -->
  <rect width="1920" height="1080" fill="#2D0013"/>
  <rect width="1920" height="1080" fill="url(#damask)"/>
  
  <!-- Subtle Bokeh Circles -->
  <g opacity="0.25">
    <circle cx="300" cy="200" r="180" fill="#800020" filter="blur(60px)"/>
    <circle cx="1600" cy="300" r="220" fill="#D4AF7F" filter="blur(80px)"/>
    <circle cx="960" cy="540" r="280" fill="#6D102C" filter="blur(90px)"/>
    <circle cx="500" cy="850" r="200" fill="#AA7738" filter="blur(70px)"/>
    <circle cx="1400" cy="800" r="190" fill="#800020" filter="blur(70px)"/>
  </g>

  <!-- Dark Vignette Overlay -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- Ornate Arch Line -->
  <rect x="100" y="80" width="1720" height="920" rx="40" fill="none" stroke="url(#goldH)" stroke-width="1.5" opacity="0.35"/>
  <rect x="120" y="100" width="1680" height="880" rx="30" fill="none" stroke="url(#goldH)" stroke-width="0.8" opacity="0.2" stroke-dasharray="6 4"/>
</svg>
