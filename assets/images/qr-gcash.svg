<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="qrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF7F"/>
      <stop offset="100%" stop-color="#9C6B30"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="20" fill="#FFFFFF" stroke="url(#qrGold)" stroke-width="4"/>
  
  <!-- Header Banner -->
  <rect x="0" y="0" width="320" height="60" rx="18" fill="#800020"/>
  <rect x="0" y="45" width="320" height="15" fill="#800020"/>
  <text x="160" y="38" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" fill="#FFF8F0" text-anchor="middle" letter-spacing="3">GCASH QR</text>
  
  <!-- Simulated QR Pattern Matrix (Burgundy Colored) -->
  <g fill="#4A001F" transform="translate(40, 80)">
    <!-- Top-Left Target -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#800020"/>
    <rect x="10" y="10" width="40" height="40" rx="4" fill="#FFFFFF"/>
    <rect x="18" y="18" width="24" height="24" rx="2" fill="#800020"/>

    <!-- Top-Right Target -->
    <rect x="180" y="0" width="60" height="60" rx="8" fill="#800020"/>
    <rect x="190" y="10" width="40" height="40" rx="4" fill="#FFFFFF"/>
    <rect x="198" y="18" width="24" height="24" rx="2" fill="#800020"/>

    <!-- Bottom-Left Target -->
    <rect x="0" y="140" width="60" height="60" rx="8" fill="#800020"/>
    <rect x="10" y="150" width="40" height="40" rx="4" fill="#FFFFFF"/>
    <rect x="18" y="158" width="24" height="24" rx="2" fill="#800020"/>

    <!-- Data Blocks -->
    <!-- Col 1 -->
    <rect x="75" y="5" width="15" height="15"/>
    <rect x="105" y="5" width="15" height="30"/>
    <rect x="135" y="5" width="30" height="15"/>
    <!-- Col 2 -->
    <rect x="75" y="35" width="30" height="15"/>
    <rect x="120" y="35" width="15" height="15"/>
    <rect x="150" y="25" width="15" height="25"/>
    <!-- Col 3 -->
    <rect x="5" y="75" width="25" height="15"/>
    <rect x="40" y="75" width="15" height="25"/>
    <rect x="75" y="65" width="15" height="20"/>
    <rect x="105" y="80" width="25" height="15"/>
    <rect x="145" y="65" width="30" height="15"/>
    <rect x="190" y="75" width="15" height="25"/>
    <rect x="220" y="75" width="15" height="15"/>
    <!-- Center Logo Shield -->
    <circle cx="120" cy="100" r="22" fill="#FFFFFF" stroke="#D4AF7F" stroke-width="2.5"/>
    <text x="120" y="106" font-family="'Great Vibes', cursive" font-size="20" font-weight="bold" fill="#800020" text-anchor="middle">I &amp; A</text>
    <!-- Col 4 -->
    <rect x="5" y="110" width="20" height="15"/>
    <rect x="35" y="115" width="25" height="15"/>
    <rect x="75" y="105" width="15" height="25"/>
    <rect x="150" y="100" width="20" height="20"/>
    <rect x="185" y="115" width="30" height="15"/>
    <rect x="225" y="105" width="10" height="25"/>
    <!-- Col 5 -->
    <rect x="75" y="145" width="35" height="15"/>
    <rect x="125" y="135" width="15" height="25"/>
    <rect x="155" y="145" width="25" height="15"/>
    <rect x="195" y="140" width="40" height="20"/>
    <!-- Col 6 -->
    <rect x="75" y="175" width="20" height="20"/>
    <rect x="110" y="170" width="30" height="15"/>
    <rect x="155" y="175" width="20" height="20"/>
    <rect x="190" y="175" width="45" height="20"/>
  </g>

  <!-- Footer Tag -->
  <text x="160" y="300" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#800020" text-anchor="middle" letter-spacing="1.5">ISABELLA &amp; ALEXANDER</text>
</svg>
