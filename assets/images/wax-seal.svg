<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="waxBase" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9E1837" />
      <stop offset="50%" stop-color="#6B0A24" />
      <stop offset="85%" stop-color="#400213" />
      <stop offset="100%" stop-color="#28000A" />
    </radialGradient>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E5" />
      <stop offset="40%" stop-color="#E5C185" />
      <stop offset="70%" stop-color="#C29B58" />
      <stop offset="100%" stop-color="#805B20" />
    </linearGradient>
    <filter id="waxDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="0.8" flood-color="#FFA8B8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Irregular Melted Wax Edge -->
  <path d="M 80 10 
           C 105 8, 122 18, 138 34 
           C 152 48, 156 68, 153 90 
           C 150 110, 142 128, 125 142 
           C 108 156, 88 154, 70 152 
           C 50 150, 32 145, 18 130 
           C 6 115, 8 92, 10 74 
           C 12 55, 20 32, 40 18 
           C 56 6, 68 11, 80 10 Z" 
        fill="url(#waxBase)" filter="url(#waxDrop)" />

  <!-- Inner Recessed Stamped Ring -->
  <circle cx="80" cy="80" r="54" fill="#58081C" stroke="url(#waxBase)" stroke-width="3" filter="url(#emboss)" />
  <circle cx="80" cy="80" r="48" fill="none" stroke="url(#sealGold)" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.85" />

  <!-- Stamped Crest & Monogram -->
  <g filter="url(#emboss)">
    <!-- Tiny Crown / Laurel Top -->
    <path d="M 72 48 L 80 43 L 88 48 L 85 53 L 75 53 Z" fill="url(#sealGold)" />
    <!-- Monogram Letters -->
    <text x="66" y="93" font-family="'Great Vibes', 'Playfair Display', Georgia, serif" font-size="44" fill="url(#sealGold)" font-weight="bold" font-style="italic" text-anchor="middle">I</text>
    <text x="80" y="84" font-family="'Playfair Display', Georgia, serif" font-size="18" fill="#FCEFD8" text-anchor="middle">&amp;</text>
    <text x="96" y="95" font-family="'Great Vibes', 'Playfair Display', Georgia, serif" font-size="44" fill="url(#sealGold)" font-weight="bold" font-style="italic" text-anchor="middle">A</text>
    
    <!-- Heart Bottom Accent -->
    <path d="M 80 108 C 78 105, 73 103, 71 106 C 68 110, 72 114, 80 118 C 88 114, 92 110, 89 106 C 87 103, 82 105, 80 108 Z" fill="url(#sealGold)" />
  </g>
</svg>
